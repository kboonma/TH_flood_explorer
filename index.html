<style>

:root{
  --sea:#dfe8ec; --land:#f4f2ec; --land-edge:#b9c2c2; --nb:#ebeae4;
  --ink:#16313a; --ink-2:#4b6268; --ink-3:#7d9095; --line:#d5dddc;
  --panel:#fbfbf8; --chip:#eef2f1; --thumb:#ecebe5;
  --basin:#d7e3df; --basin-edge:#8fa8a4;
  --tapi:#b86e14; --tapi-fill:#f2dcb8;

}

  --sea:#0f1b20; --land:#1d2c31; --land-edge:#3a5057; --nb:#152227;
  --ink:#e4ecea; --ink-2:#a8bab8; --ink-3:#7a8f8e; --line:#2b3d42;
  --panel:#132126; --chip:#1e3036; --thumb:#1d2c31;
  --basin:#21363a; --basin-edge:#4f6f6c;
  --tapi:#e8a24a; --tapi-fill:#4a3a22; --sel:#e8a24a;
  --st-q:#e4ecea; --st-r:#f06a52;
  --c1:#5a3a1e; --c2:#8a5221; --c3:#c06b25; --c4:#e58a3a; --c5:#f6b26b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f1b20; --land:#1d2c31; --land-edge:#3a5057; --nb:#152227;
  --ink:#e4ecea; --ink-2:#a8bab8; --ink-3:#7a8f8e; --line:#2b3d42;

html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
header h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.crumb button{font:inherit;color:var(--d5);background:none;border:0;padding:2px 4px;cursor:pointer;border-radius:4px}
.src{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
#map{background:var(--sea);min-height:0}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
aside{border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding-block:16px 28px;padding-left:16px;
  padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.sec h2{font-family:var(--f-display);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.lede{color:var(--ink-2);margin:0;font-size:13.5px}
.big{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0 0 4px;text-wrap:balance}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
/* country list */
.basin-list{display:flex;flex-direction:column}
.basin-row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:5px;cursor:pointer;border:0;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.basin-row:hover{background:var(--chip)}
.basin-row .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:20px}
.basin-row .tag{margin-left:auto;font-size:11px;color:var(--ink-3)}
.basin-row.ready{background:var(--tapi-fill)} .basin-row.ready .tag{color:var(--tapi);font-weight:600}
/* map layers */
.nb{fill:none;stroke:var(--land-edge);stroke-width:.6}
.th{fill:none;stroke:var(--land-edge);stroke-width:1}
.basin{fill:var(--basin);fill-opacity:.55;stroke:var(--basin-edge);stroke-width:.8}
.basin:hover{fill-opacity:.9}
.basin.tapi{fill:var(--tapi-fill);fill-opacity:.9;stroke:var(--tapi);stroke-width:2}
.basin.dim{fill-opacity:.12;stroke-opacity:.35}
.basin.tapi.open{fill-opacity:.12}
.frame{fill:none;stroke:var(--ink-3);stroke-dasharray:4 4;stroke-width:1}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-family:var(--f-body)}
.blabel{background:none;border:0;box-shadow:none;font-family:var(--f-display);font-weight:600;color:var(--tapi);font-size:13px}
.blabel:before{display:none}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--ink-3)}
.leaflet-control-layers{background:var(--panel);color:var(--ink);border:1px solid var(--line)!important;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)!important;font-family:var(--f-body);font-size:12.5px}
.leaflet-control-layers-expanded{padding:6px 10px 6px 6px}
.leaflet-control-layers label{display:flex;align-items:center;gap:4px;margin:2px 0;cursor:pointer}
.basin{fill-opacity:.35}
#map.sat .basin{fill-opacity:.12;stroke:#fff;stroke-opacity:.7}
#map.sat .basin.tapi{fill-opacity:.25;stroke:#ffb347}
#map.sat .prov,#map.sat .amph{stroke:#fff;stroke-opacity:.6}
#map.sat .tb{stroke:#fff;stroke-opacity:.8}
#map.sat .stlab{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.stq{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--st-q)}
.str{width:11px;height:11px;border-radius:50%;background:var(--st-r);border:2px solid var(--panel)}
.stlab{background:none;border:0;box-shadow:none;font-family:var(--f-mono);font-size:11px;color:var(--ink);padding:0;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.stlab:before{display:none}
/* controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 4px;border:0;background:var(--panel);color:var(--ink-2);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.seg small{display:block;font-size:10.5px;opacity:.75;font-family:var(--f-mono)}
.ctlrow{display:flex;flex-direction:column;gap:8px}
.ctlrow label.l{font-size:12px;color:var(--ink-3)}
/* small multiples */
.grid{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:4px;align-items:stretch}
.grid .h{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-align:center;align-self:end}
.grid .rh{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);align-self:center;line-height:1.2}
.tile{position:relative;border:1px solid var(--line);border-radius:4px;background:var(--thumb);padding:0;cursor:pointer;overflow:hidden;aspect-ratio:2133/1752;max-width:100%}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile span{position:absolute;left:3px;bottom:2px;font-family:var(--f-mono);font-size:10px;color:var(--ink);background:var(--panel);padding:0 3px;border-radius:2px;opacity:.9}
.tile[aria-pressed="true"]{outline:2.5px solid var(--sel);outline-offset:-1px}
/* event card */
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card .t{font-family:var(--f-display);font-weight:700;font-size:17px}
.card .t small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--ink-3);display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.kv span{font-size:11px;color:var(--ink-3)}
.ramp{display:grid;grid-template-columns:repeat(7,1fr);height:12px;border-radius:2px;overflow:hidden}
.ramp-lab{display:grid;grid-template-columns:repeat(7,1fr);font-family:var(--f-mono);font-size:10px;color:var(--ink-3);margin-top:3px;text-align:center}
.ctrl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-top:8px}
.ctrl input[type=range]{flex:1;accent-color:var(--d5)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
/* subdistrict table */
.filt{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chipbtn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--chip);color:var(--ink-2);padding:2px 10px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sdt{width:100%;border-collapse:collapse;font-size:12.5px}
.sdt th{text-align:left;font-weight:500;color:var(--ink-3);font-size:11px;padding:4px;border-bottom:1px solid var(--line)}
.sdt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.sdt .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sdt .nm small{display:block;color:var(--ink-3);font-size:10.5px}
.sdt .d{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-left:4px}
.flag{color:var(--tapi);font-weight:700;margin-left:3px}
.bar{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--chip);width:100%;min-width:60px}
.bar i{display:block;height:100%}
.tot td{font-weight:600;border-bottom:2px solid var(--line)}
.trow{cursor:pointer} .trow:hover td{background:var(--chip)} .trow.on td{background:var(--tapi-fill)}
.trow:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.prov{fill:none;stroke:var(--land-edge);stroke-width:.6;stroke-opacity:.8}
.amph{fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:5 3}
.tb{fill:var(--ink);fill-opacity:0;stroke:var(--ink-2);stroke-opacity:.55}
.tb:hover{fill-opacity:.08;stroke-opacity:1}
.tb.c0{fill-opacity:0} .tb.c1{fill:var(--c1);fill-opacity:.8} .tb.c2{fill:var(--c2);fill-opacity:.8} .tb.c3{fill:var(--c3);fill-opacity:.8} .tb.c4{fill:var(--c4);fill-opacity:.82} .tb.c5{fill:var(--c5);fill-opacity:.85}
.tb.tsel{stroke:var(--sel);stroke-opacity:1}
details{border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:12.5px}
.hist div b{font-family:var(--f-mono);margin-right:6px}
.hist p{margin:2px 0 0;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:10px;margin:0}
.note li{margin-bottom:4px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 48vh minmax(0,1fr)}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
  .src{margin-left:0}
}
</style>

function rowFor(name){const id=evId(state.river,state.ssp,state.per);return D.sub.find(r=>r[0]===id&&r[2]===name);}
function pctClass(p){return p>=50?5:p>=30?4:p>=15?3:p>=5?2:p>0.5?1:0;}
function tStyle(f){
  const r=rowFor(f.properties.name_en), p=r?r[12]/r[4]*100:0, sel=state.selT===f.properties.name_en;
  const k=state.mode==='pct'?' c'+pctClass(p):'';
  return {className:'tb'+k+(sel?' tsel':''),weight:sel?3:1};
}
function tTip(name){const r=rowFor(name); if(!r) return name;

      <span class="tag">${r.id==='tapi'?'มีข้อมูล':'—'}</span></button>`).join('')}</div></div>
    <p class="note">ขอบเขตประเทศและจังหวัดจากกรมแผนที่ทหาร (OCHA COD-AB) · ลุ่มน้ำตาปีลอกจากแผนที่ในรายงาน (Figure 2) · ลุ่มน้ำอื่นยังเป็นรูปร่างประมาณ ให้แทนด้วย shapefile ของ สทนช.</p>`;
  panel.querySelectorAll('.basin-row').forEach(b=>b.onclick=()=>b.dataset.id==='tapi'?openTapi():map.flyToBounds(basinLayers[b.dataset.id].getBounds(),{duration:.6,maxZoom:8}));
}

/* ---------- tapi view ---------- */
function openTapi(){
  state.view='tapi';
  basinsLayer.eachLayer(l=>{const e=l.getElement(); if(!e)return; e.classList.contains('tapi')?e.classList.add('open'):e.classList.add('dim');});
  map.removeLayer(tapiLabel); frame.addTo(map); amphLayer.addTo(map); tambonLayer&&tambonLayer.addTo(map);
  if(state.stations) stLayer.addTo(map);
  showFlood();
  map.flyToBounds(FB,{padding:[10,10],duration:1});
  crumb.innerHTML='<button id="back">ประเทศไทย</button><span>›</span><button id="whole">ลุ่มน้ำตาปี</button><span>›</span><span>สุราษฎร์ธานี–พุนพิน</span>';
  document.getElementById('back').onclick=openCountry;
  document.getElementById('whole').onclick=()=>map.flyToBounds(basinLayers.tapi.getBounds(),{duration:.8});
  renderPanel();
}

function depthBar(v,total){const s=total||1;return `<div class="bar">${v.map((x,i)=>`<i style="width:${x/s*100}%;background:var(--d${i+1})" title="${DEPTH[i]} ม.: ${fmt(x,2)} km²"></i>`).join('')}</div>`;}

function renderPanel(keep){
  const y=panel.scrollTop; if(keep) requestAnimationFrame(()=>{panel.scrollTop=y;});
  const id=evId(state.river,state.ssp,state.per), e=EV[id];
  const rows=D.sub.filter(r=>r[0]===id).filter(r=>state.dist==='all'||r[1]===state.dist).sort((a,b)=>b[12]-a[12]);
  const tot=[5,6,7,8,9,10,11].map(i=>rows.reduce((s,r)=>s+r[i],0)), totF=rows.reduce((s,r)=>s+r[12],0), totA=rows.reduce((s,r)=>s+r[4],0);
  const tile=(s,p)=>{const k=evId(state.river,s,p), x=EV[k], on=s===state.ssp&&p===state.per;
    return `<button class="tile" data-s="${s}" data-p="${p}" aria-pressed="${on}" aria-label="${s} ${p}: ${fmt(x.flooded_km2_total_report)} ตร.กม."><img src="thumb/${k}.png" alt=""><span>${Math.round(x.flooded_km2_total_report)}</span></button>`;};
  panel.innerHTML=`
    <div class="sec"><p class="big">ลุ่มน้ำตาปี · ฉากทัศน์น้ำท่วมอนาคต</p>
      <p class="lede">ความลึกน้ำท่วม ณ วันที่น้ำสูงสุดของแต่ละเหตุการณ์ จากแบบจำลอง HEC-RAS 1D/2D ที่ใช้ฝนจาก CMIP6 (ปรับแก้ด้วย EQM) และระดับน้ำทะเลที่สูงขึ้น</p></div>

    <div class="sec ctlrow">
      <label class="l">เหตุการณ์ที่เกิดจากน้ำสูงสุดของ</label>
      <div class="seg" role="group" aria-label="แม่น้ำ">${Object.entries(RIV).map(([k,v])=>`<button data-r="${k}" aria-pressed="${state.river===k}">${v.full}<small>${v.st}</small></button>`).join('')}</div>
      <label class="l">ฉากทัศน์ภูมิอากาศ</label>
      <div class="seg" role="group" aria-label="ฉากทัศน์">${SSP.map(s=>`<button data-ssp="${s}" aria-pressed="${state.ssp===s}">${s}</button>`).join('')}</div>
      <label class="l">ช่วงเวลา</label>
      <div class="seg" role="group" aria-label="ช่วงเวลา">${PER.map(p=>`<button data-per="${p}" aria-pressed="${state.per===p}">${p}<small>${PER_TH[p]}</small></button>`).join('')}</div>
    </div>

    <div class="card">
      <div class="t">${RIV[state.river].full} · ${state.ssp} · ${state.per}<small>วันที่น้ำสูงสุด ${e.peak_date} · Figure ${e.report_figure} ในรายงาน</small></div>
      <div class="kv">
        <div><b>${fmt(e.peak_discharge_m3s,0)}</b><span>Q สูงสุดที่ ${e.driver_station} (ม³/วิ)</span></div>
        <div><b>${fmt(e.max_sea_level_masl,2)}</b><span>ระดับน้ำทะเลสูงสุด (ม.รทก.)</span></div>
        <div><b>${fmt(e.flooded_km2_total_report,1)}</b><span>พื้นที่ท่วม 2 อำเภอ (ตร.กม.)</span></div>
      </div>
      <div class="kv">
        <div><b>${fmt(e.flooded_km2_mueang,1)}</b><span>อ.เมืองสุราษฎร์ธานี</span></div>
        <div><b>${fmt(e.flooded_km2_phunphin,1)}</b><span>อ.พุนพิน</span></div>
        <div></div>
      </div>
    </div>

    <div class="sec"><h2>เทียบ 9 เหตุการณ์ของ${RIV[state.river].full} (ตัวเลข = ตร.กม.)</h2>
      <div class="grid"><div></div>${PER.map(p=>`<div class="h">${p}</div>`).join('')}
        ${SSP.map(s=>`<div class="rh">${s.replace('SSP','SSP<br>')}</div>${PER.map(p=>tile(s,p)).join('')}`).join('')}
      </div></div>

    <div class="sec"><h2>การแสดงผลบนแผนที่</h2>
      <div class="seg" role="group" aria-label="การแสดงผล" style="margin-bottom:10px">
        <button data-mode="depth" aria-pressed="${state.mode==='depth'}">ความลึกน้ำ</button>
        <button data-mode="pct" aria-pressed="${state.mode==='pct'}">% พื้นที่ท่วมรายตำบล</button></div>
      ${state.mode==='depth'?`
      <div class="ramp">${DEPTH.map((_,i)=>`<i style="background:var(--d${i+1})"></i>`).join('')}</div>
      <div class="ramp-lab">${DEPTH.map(d=>`<span>${d}</span>`).join('')}</div>
      <p class="lede" style="font-size:12px;margin-top:4px">หน่วยเป็นเมตร · เส้นบางคือขอบเขตตำบล ชี้เพื่อดูตัวเลข</p>`:`
      <div class="ramp" style="grid-template-columns:repeat(5,1fr)">${[1,2,3,4,5].map(i=>`<i style="background:var(--c${i})"></i>`).join('')}</div>
      <div class="ramp-lab" style="grid-template-columns:repeat(5,1fr)"><span>0.5–5%</span><span>5–15%</span><span>15–30%</span><span>30–50%</span><span>≥50%</span></div>
      <p class="lede" style="font-size:12px;margin-top:4px">สัดส่วนพื้นที่ตำบลที่ถูกน้ำท่วม (ตารางที่ 34–35)</p>`}
      <div class="ctrl"><label for="op">ความทึบ</label><input id="op" type="range" min="0" max="1" step=".05" value="${state.opacity}"></div>
      <div class="toggles"><label><input id="stt" type="checkbox" ${state.stations?'checked':''}> สถานีวัด</label></div>
    </div>

    <div class="sec"><h2>รายตำบล · พื้นที่ท่วมตามความลึก</h2>
      <div class="filt">${[['all','ทั้ง 2 อำเภอ'],['M','อ.เมืองฯ'],['P','อ.พุนพิน']].map(([k,t])=>`<button class="chipbtn" data-d="${k}" aria-pressed="${state.dist===k}">${t}</button>`).join('')}</div>
      <div style="overflow-x:auto"><table class="sdt">
        <thead><tr><th>ตำบล</th><th class="num">ท่วม ตร.กม.</th><th class="num">%</th><th style="width:34%">สัดส่วนความลึก</th></tr></thead>
        <tbody>
          <tr class="tot"><td>รวม ${rows.length} ตำบล</td><td class="num">${fmt(totF,1)}</td><td class="num">${fmt(totF/totA*100,0)}</td><td>${depthBar(tot,totF)}</td></tr>
          ${rows.map(r=>`<tr data-n="${r[2]}" class="trow${state.selT===r[2]?' on':''}" tabindex="0"><td class="nm">${r[3]}${VUL.has(r[2])?'<span class="flag" title="รายงานระบุว่าเสี่ยงที่สุด">●</span>':''}<span class="d">${r[1]==='M'?'เมือง':'พุนพิน'}</span><small>${r[2]}</small></td>
            <td class="num">${fmt(r[12],2)}</td><td class="num">${fmt(r[12]/r[4]*100,0)}</td><td>${depthBar(r.slice(5,12),r[12])}</td></tr>`).join('')}
        </tbody></table></div>
      <p class="note" style="border:0;padding-top:6px"><span class="flag">●</span> ตำบลที่รายงานระบุว่าเสี่ยงน้ำท่วมมากที่สุด · % คือสัดส่วนของพื้นที่ตำบล</p>
    </div>

    <details><summary>น้ำท่วมในอดีต (ตารางที่ 2 ในรายงาน)</summary>
      <div class="hist">${D.hist.map(h=>`<div><b>${h.year}</b>${h.trigger}<p>${h.impact}</p></div>`).join('')}</div></details>

    <ul class="note">
      <li>แผนที่น้ำท่วมแปลงจากรูป Figure 55–72 ในรายงาน และอ้างพิกัดจากกริดละติจูด/ลองจิจูดในรูป (ความละเอียดราว 25 ม.) ใช้สำหรับการแสดงผล</li>
      <li>ตัวเลขรายตำบลมาจากตารางที่ 34–35 ในรายงานโดยตรง</li>
      <li>เหตุการณ์ของพุมดวงอิงแบบจำลองที่มีค่าความแม่นยำต่ำ (NSE 0.16–0.48) ตามที่รายงานเตือนไว้</li>
      <li>ขอบเขตประเทศ จังหวัด อำเภอ และตำบล: กรมแผนที่ทหาร (RTSD) ผ่าน OCHA COD-AB (CC BY-IGO) พื้นที่ตำบลตรงกับตารางในรายงาน</li><li>รายงานยังไม่มีชั้นข้อมูลโครงสร้างสำคัญ ต้องเพิ่มจาก OSM หรือหน่วยงาน</li>
    </ul>`;

  panel.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.river=b.dataset.r;update();});
  panel.querySelectorAll('[data-ssp]').forEach(b=>b.onclick=()=>{state.ssp=b.dataset.ssp;update();});
  panel.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{state.per=b.dataset.per;update();});
  panel.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{state.ssp=b.dataset.s;state.per=b.dataset.p;update();});
  panel.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.dist=b.dataset.d;renderPanel();});
  panel.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;update();});
  panel.querySelectorAll('tr[data-n]').forEach(tr=>{const go=()=>{const n=tr.dataset.n; state.selT=state.selT===n?null:n; restyleT(); renderPanel(true);
      const l=tambonByName[n]; if(l&&state.selT) map.flyToBounds(l.getBounds(),{maxZoom:13,duration:.6,padding:[40,40]});};
    tr.onclick=go; tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  document.getElementById('op').oninput=ev=>{state.opacity=+ev.target.value; current&&current.setOpacity(state.opacity);};
  document.getElementById('stt').onchange=ev=>{state.stations=ev.target.checked; state.stations?stLayer.addTo(map):map.removeLayer(stLayer);};
}
function update(){ showFlood(); renderPanel(true); }

document.addEventListener('keydown',ev=>{
  if(state.view!=='tapi'||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const i=PER.indexOf(state.per);
  if(ev.key==='ArrowRight'&&i<2){state.per=PER[i+1];update();}
  if(ev.key==='ArrowLeft'&&i>0){state.per=PER[i-1];update();}
});

openCountry();
</script>

</body>
</html>
