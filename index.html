/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {

	        transition: opacity 0.2s linear;

.leaflet-container {

/* general typography */

/* general toolbar styles */

.leaflet-bar {

	}
.leaflet-bar a {
	background-color: #fff;

.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:last-child {

	}

	}

.leaflet-touch .leaflet-bar a {

.leaflet-control-layers {

.leaflet-control-layers-toggle {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-popup {

	margin-bottom: 20px;

.leaflet-popup-content-wrapper {

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,

.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}

}
.leaflet-tooltip-right {

}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

/* =========================================================================
   Windy-style look: full-screen dark map, floating glass panels,
   icon rail on the right, timeline along the bottom. Deliberately dark-only.
   ========================================================================= */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{
  --sea:#0b1014; --land:#1a2126; --land-edge:#4a5960; --nb:#12181c;
  --ink:#eef2f3; --ink-2:#b9c4c7; --ink-3:#86959a; --line:rgba(255,255,255,.10);
  --panel:#151b20; --chip:rgba(255,255,255,.07); --thumb:#1b2227;
  --basin:#2a3940; --basin-edge:#6f8b90;
  --tapi:#f0a24a; --tapi-fill:rgba(240,162,74,.18); --sel:#ffb347;
  --fc:#35c4d6; --fc-fill:rgba(53,196,214,.16);
  --glass:rgba(20,26,31,.84); --glass-2:rgba(32,40,46,.92); --accent:#ff7a45;
  color-scheme:dark}
body{background:#0b1014}
.app{display:block;position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;background:#0b1014}
.leaflet-container{background:#0b1014}
/* header: floating pill, top-left */
header{position:absolute;z-index:1100;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:auto;
  max-width:calc(100% - 24px - 64px);padding:7px 8px 7px 14px!important;background:var(--glass);border:1px solid var(--line)!important;border-radius:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.35);gap:10px 14px}
header h1{font-size:16px;letter-spacing:.01em}

header .src{display:none}
.crumb{font-size:12.5px} .crumb button{color:var(--fc)}
.ptoggle{font:inherit;font-size:12px;color:var(--ink-2);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;margin-left:auto}
.ptoggle:hover{color:var(--ink)} .ptoggle:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
/* floating glass panel on the left */
aside{position:absolute;z-index:1050;top:calc(62px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:84px;width:380px;
  background:var(--glass)!important;border:1px solid var(--line)!important;border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(0,0,0,.45);padding:16px!important;transition:transform .25s ease,opacity .25s ease}
.app.pclosed aside{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
aside .big{font-size:20px}
aside .card,.stcard,.seg,.seg button{background:transparent}
.card,.stcard{background:rgba(255,255,255,.04)!important;border-color:var(--line)!important}
.seg{border-color:var(--line)!important}
.seg button{color:var(--ink-2);border-left-color:var(--line)!important}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0e1418}
.basin-row:hover,.lvrow:hover,.strow:hover,.trow:hover td,.rtab tr[data-rb]:hover td{background:rgba(255,255,255,.06)!important}
.demo{background:rgba(240,196,25,.12);border-color:rgba(240,196,25,.6)}
aside::-webkit-scrollbar{width:8px} aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
/* right icon rail */
.rail{position:absolute;z-index:1000;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.ri{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:7px 2px 5px;border:0;border-radius:10px;background:none;color:var(--ink-2);font:inherit;font-size:10.5px;cursor:pointer}
.ri svg{width:22px;height:22px;fill:currentColor}
.ri.sm svg{width:18px;height:18px}
.ri:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.ri.on{background:var(--accent);color:#fff}
.ri.sm.on{background:rgba(255,255,255,.14);color:#fff}
.ri:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
/* bottom timeline (rain) */
.wtl{position:absolute;z-index:1000;left:404px;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.4);color:var(--ink);transition:left .25s ease}
.app.pclosed .wtl,.app.pclosed .timebar{left:max(12px,env(safe-area-inset-left,0px))}
.wtl-play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(255,122,69,.4)}
.wtl-play:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wtl-main{flex:1;min-width:0}
.wtl-track{position:relative;display:flex;height:34px;border-radius:8px;background:rgba(255,255,255,.06);cursor:pointer;touch-action:none;user-select:none}
.wtl-track:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wtl-day{border-left:1px solid rgba(255,255,255,.14);display:flex;align-items:flex-end;padding:0 0 4px 6px;min-width:0}
.wtl-day:first-child{border-left:0}
.wtl-day span{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtl-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,122,69,.0),rgba(255,122,69,.28));border-radius:8px 0 0 8px;pointer-events:none}
.wtl-knob{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);transform:translateX(-1px);pointer-events:none}
.wtl-knob span{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:11.5px;
  padding:2px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.wtl-legend{flex:none;display:flex;align-items:center;gap:6px}
.wtl-legend .u{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.wtl-legend .bar{display:flex;justify-content:space-between;align-items:center;width:200px;height:18px;border-radius:9px;padding:0 6px}
.wtl-legend .bar i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;color:#0b1014;font-weight:600}
/* forecast time bar (Nan view) in the same style */
.timebar{left:404px!important;right:calc(12px + env(safe-area-inset-right,0px))!important;transform:none!important;max-width:none!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;
  background:var(--glass)!important;border:1px solid var(--line)!important;border-radius:14px!important;padding:8px 10px!important;backdrop-filter:blur(10px);transition:left .25s ease}
.tb-play{width:40px!important;height:40px;border-radius:50%!important;background:var(--accent)!important;color:#fff!important;align-self:center}
.tb-days{flex:1}
.tb-days button{flex:1}
.tb-days button[aria-pressed="true"]{background:var(--accent)!important}
/* leaflet controls, legend, popups */
.leaflet-bar{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35)!important}
.leaflet-bar a{background:var(--glass)!important;color:var(--ink)!important;border-bottom-color:var(--line)!important}
.leaflet-bottom.leaflet-right{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.leaflet-bottom.leaflet-right .leaflet-control-attribution{position:fixed;right:0;bottom:0;margin:0}
.leaflet-control-attribution{background:rgba(11,16,20,.6)!important;color:#7f8d92!important;font-size:10px}
.leaflet-control-attribution a{color:#9fb3b8}
.livelegend{background:var(--glass)!important;border-color:var(--line)!important;border-radius:12px!important;backdrop-filter:blur(10px)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--glass-2)!important;color:var(--ink)!important;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
.leaflet-tooltip{background:var(--glass-2)!important;color:var(--ink)!important;border-color:var(--line)!important}
.stlab{color:#fff!important;text-shadow:0 0 3px #000,0 0 3px #000!important}
.blabel{text-shadow:0 0 4px #000!important}
.basin{fill-opacity:.22!important}
.basin.tapi{fill-opacity:.35!important} .basin.fc{fill-opacity:.35!important}
.basin.dim{fill-opacity:.05!important}
.basin.open,.basin.tapi.open,.basin.fc.open{fill-opacity:.04!important}
.prov{stroke:#5b6b71!important}
.tst{background:var(--glass-2)!important}
/* phones: panel becomes a bottom sheet, rail shrinks */
@media (max-width:820px){
  header{max-width:calc(100% - 24px - 78px)}
  .ptoggle{display:none}
  aside{top:auto;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:auto;max-height:44vh;border-radius:16px 16px 0 0;
    padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important}
  .ri{width:46px;font-size:9.5px;padding:6px 2px 4px} .ri svg{width:19px;height:19px}
  .wtl,.timebar{left:0!important;right:0!important;bottom:0!important;border-radius:0!important;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;
    padding-left:max(10px,env(safe-area-inset-left,0px))!important;padding-right:max(10px,env(safe-area-inset-right,0px))!important}
  .wtl{gap:8px} .wtl-legend{display:none} .wtl-play{width:34px;height:34px}
  .leaflet-bottom.leaflet-right{bottom:calc(44vh + 72px)}
}

.chart .trb{fill:var(--s4);fill-opacity:.55;cursor:pointer}
.chart .trb.on{fill:var(--accent);fill-opacity:1}
.chart .trb:hover{fill-opacity:.9}

/* ---------- river flow (upstream → downstream) ---------- */
.flowdash{animation:rvflow 1.1s linear infinite}
@keyframes rvflow{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.flowdash{animation:none}}
.rvchips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.rvchips button{font:inherit;font-size:12px;color:var(--ink-2);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.rvchips button:hover{color:var(--ink)}
.rvchips button b{font-family:var(--f-mono);font-weight:600;margin-left:6px;opacity:.65}
.rvchips button[aria-pressed="true"]{background:#ffb347;color:#1a1206;border-color:transparent}
.rvchips button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.rvflow{list-style:none;margin:0;padding:0;position:relative}
.rvflow::before{content:'';position:absolute;left:11px;top:12px;bottom:12px;width:2px;border-radius:1px;background:linear-gradient(rgba(79,184,238,.35),#4fb8ee)}
.rvflow li{position:relative;padding-left:32px}
.rvflow .no{position:absolute;left:0;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:700;color:#0b1014;box-shadow:0 0 0 3px #182026}
.rv-end{font-size:12px;color:var(--ink-3);padding:3px 0 3px 32px}
.rv-end b{color:var(--ink)}
.rv-end::before{content:'';position:absolute;left:5px;top:50%;width:10px;height:10px;margin-top:-6px;border-radius:2px;background:#182026;border:2px solid #4fb8ee}
.rv-end.dn::before{border-radius:50%;background:#4fb8ee}
.rv-gap{font-family:var(--f-mono);font-size:11px;color:#7fcbf2;padding:2px 0 2px 32px}
.rvst{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;margin:2px 0;text-align:left;font:inherit;color:inherit;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
.rvst:hover{background:rgba(255,255,255,.08)}
.rvst:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.rvst .nm{overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rvst .nm i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.rvst .nm small{display:block;color:var(--ink-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvst .num{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rvst .num small{display:block;color:var(--ink-3);font-size:10.5px}
.rvno{width:18px;height:18px;border-radius:50%;background:#ffb347;color:#1a1206;font:700 10.5px/18px var(--f-mono);text-align:center;box-shadow:0 0 0 2px rgba(11,16,20,.85);cursor:pointer}

/* ---------- demo: forecast → flood ---------- */
.dcta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:linear-gradient(120deg,rgba(255,122,69,.22),rgba(79,184,238,.14));border:1px solid rgba(255,122,69,.55);border-radius:12px;padding:12px 14px;margin:2px 0 14px}
.dcta:hover{border-color:var(--accent);background:linear-gradient(120deg,rgba(255,122,69,.3),rgba(79,184,238,.2))}
.dcta:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.dcta .pl{grid-row:span 2;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 10px rgba(255,122,69,.45)}
.dcta b{font-size:14.5px}
.dcta small{color:var(--ink-2);font-size:12px}
.dpipe{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;counter-reset:none}
.dpipe li{position:relative}
.dpipe li+li::before{content:'›';position:absolute;left:-6px;top:9px;color:var(--ink-3);font-size:14px}
.dpipe button{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font:inherit;font-size:11px;color:var(--ink-3);background:none;border:0;border-radius:8px;cursor:pointer}
.dpipe button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:12px;
  background:rgba(255,255,255,.08);color:var(--ink-2);border:1px solid var(--line)}
.dpipe button.done i{background:rgba(79,184,238,.25);color:#bfe6fa;border-color:transparent}
.dpipe button.on{color:var(--ink)}
.dpipe button.on i{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 0 0 3px rgba(255,122,69,.25)}
.dpipe button:hover{background:rgba(255,255,255,.05)}
.dpipe button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.dbody{min-height:200px}
.dlead{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 10px}
.dlead b{color:var(--ink)}
.dsrc{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin:10px 0 0}
.dtag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;margin-right:4px;vertical-align:1px}
.dtag.real{background:rgba(52,199,89,.18);color:#7ee2a0}
.dtag.dev{background:rgba(255,122,69,.2);color:#ffb08f}
.dmodel{font-size:12px;color:var(--ink-2);background:rgba(255,122,69,.08);border:1px dashed rgba(255,122,69,.5);border-radius:8px;padding:7px 10px;margin:0 0 8px}
.dq-cap{stroke:#ff6b6b;stroke-width:1.2;stroke-dasharray:5 4}
.dq-70{stroke:var(--s4);stroke-width:1;stroke-dasharray:2 3}
.dq-lab{font-family:var(--f-mono);font-size:9.5px;fill:#ff9b9b}
.dq-lab.s4{fill:#8cc4ff}
.dq-lab.pk{fill:var(--ink);font-weight:600}
.dq-area{fill:rgba(79,184,238,.18)}
.dq-ln{fill:none;stroke:#4fb8ee;stroke-width:2;stroke-linejoin:round}
.dq-pk{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.dqrow{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.dqrow input{flex:1;accent-color:var(--accent)}
.dqrow output{font-family:var(--f-mono);font-size:20px;font-weight:700;min-width:58px;text-align:right}
.dqrow .u{font-size:11.5px;color:var(--ink-3)}
.dpresets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.dpresets button{font:inherit;font-size:11.5px;color:var(--ink-2);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.dpresets button[aria-pressed="true"]{background:var(--ink);color:#0e1418;border-color:transparent}
.dpresets button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.dl-pt{fill:#2a5a74;stroke:#7fcbf2;stroke-width:1.2;cursor:default}
.dl-pt.on{fill:var(--accent);stroke:#fff;stroke-width:2}
.dl-now{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.dl-link{stroke:var(--accent);stroke-width:1;opacity:.6}
.dpick{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.dpick b{color:var(--ink)}
.dpick span b{font-family:var(--f-mono);font-size:15px;color:var(--accent)}
.dalert{display:grid;gap:2px;border-radius:12px;padding:10px 14px;margin:0 0 10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-left:5px solid var(--ink-3)}
.dalert span{font-size:11.5px;color:var(--ink-3)}
.dalert b{font-size:20px}
.dalert small{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.dalert.s5{border-left-color:var(--s5)} .dalert.s5 b{color:var(--s5)}
.dalert.s4{border-left-color:var(--s4)} .dalert.s4 b{color:var(--s4)}
.dalert.s3{border-left-color:var(--s3)} .dalert.s3 b{color:var(--s3)}
.dalert.s2{border-left-color:var(--s2)} .dalert.s1{border-left-color:var(--s1)}
.dimp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.dimp div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px}
.dimp b{display:block;font-family:var(--f-mono);font-size:19px}
.dimp span{font-size:11px;color:var(--ink-3)}
.ax-t{font-size:11px;color:var(--ink-3);margin:2px 0 0}
.dexit{width:100%;margin-top:12px;font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer}
.dexit:hover{background:rgba(255,255,255,.1)}
.dnav{position:sticky;bottom:-16px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px -16px -16px;padding:10px 16px;
  background:var(--glass-2);border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.dnav span{font-size:11.5px;color:var(--ink-3)}
.dnav button{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer}
.dnav button.pri{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.dnav button:disabled{opacity:.35;cursor:default}
.dnav button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.dpulse{position:relative;width:0;height:0}
.dpulse i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(255,122,69,.6);animation:dpulse 1.6s ease-out infinite;border:2px solid #fff}
.dpulse b{position:absolute;left:13px;top:-10px;font-family:var(--f-mono);font-size:12px;color:#fff;background:var(--accent);padding:1px 6px;border-radius:6px;white-space:nowrap}
@keyframes dpulse{to{box-shadow:0 0 0 18px rgba(255,122,69,0)}}
@media (prefers-reduced-motion:reduce){.dpulse i{animation:none}}
@media (max-width:820px){.dnav{bottom:-16px}}

/* Kanit everywhere */
body,button,input,select,textarea,.leaflet-container,.leaflet-container *,.leaflet-popup-content,.leaflet-tooltip,svg text{font-family:"Kanit",system-ui,sans-serif!important}
body{font-weight:300}
b,strong,h1,h2,.big,.t{font-weight:500}

/* ---------- situation per basin ---------- */
.bsctl{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.bsctl .seg button{font-size:12px;padding:5px 4px}
.bslist{display:flex;flex-direction:column;gap:2px}
.bsrow{display:flex;flex-direction:column;gap:5px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.bsrow:hover{background:rgba(255,255,255,.06)}
.bsrow:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.bsrow.pilot{background:var(--tapi-fill)}
.bsrow .h{display:flex;align-items:baseline;gap:8px;min-width:0}
.bsrow .n{font-size:11px;color:var(--ink-3);width:18px;flex:none}
.bsrow .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsrow .nm em{font-style:normal;font-size:10.5px;color:var(--tapi);font-weight:500;margin-left:2px}
.bsrow .ct{flex:none;display:flex;gap:7px;font-size:11.5px;white-space:nowrap}
.bsrow .hi{color:#8cc4ff}
.bsrow .lo{color:#f2c94c}
.bsrow .tt{color:var(--ink-3)}
.bsbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.05)}
.bsbar.empty{height:4px}
.bsbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;line-height:1;color:#0b1014;font-weight:600;min-width:2px}
.bsbar .s1{background:var(--s1)} .bsbar .s2{background:var(--s2)} .bsbar .s3{background:var(--s3)} .bsbar .s4{background:var(--s4)} .bsbar .s5{background:var(--s5)}
.bsbar .s4,.bsbar .s5,.bsbar .s1{color:#fff}
.bsnote{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
.bsnote span{white-space:nowrap}
.bsnote i,.bstip div i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.bstip{margin-top:6px;min-width:220px}
.bstip .bsbar{height:10px;margin-bottom:4px}
.bstip .bsbar i{font-size:0}
.bstip div{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px}
.bstip .bsbar i{border-radius:0;width:auto;height:auto;margin:0}

/* ---------- basin focus card ---------- */
.bfocus{position:absolute;z-index:1000;top:calc(12px + env(safe-area-inset-top,0px));right:calc(92px + env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 200px);overflow:auto;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 24px rgba(0,0,0,.45);color:var(--ink);animation:bfin .2s ease}
.bfocus[hidden]{display:none}
@keyframes bfin{from{opacity:0;transform:translateY(-6px)}}
.bf-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.bf-h small{display:block;font-size:11px;color:var(--ink-3)}
.bf-h b{font-size:17px;font-weight:500;line-height:1.25}
.bf-x{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink-2);font-size:17px;line-height:1;cursor:pointer}
.bf-x:hover{color:var(--ink)}
.bf-x:focus-visible,.bf-st:focus-visible,.bf-go:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.bf-m{font-size:11.5px;color:var(--ink-3);margin:0 0 6px}
.bfocus .bsbar{height:14px;margin-bottom:8px}
.bf-g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
.bf-g div{text-align:center;background:rgba(255,255,255,.04);border-radius:8px;padding:5px 2px}
.bf-g div.z{opacity:.45}
.bf-g b{display:block;font-size:18px;font-weight:600;line-height:1.2}
.bf-g span{font-size:9.5px;color:var(--ink-3);line-height:1.2;display:block}
.bf-l{font-size:11.5px;color:var(--ink-2);margin:8px 0 3px;font-weight:500}
.bf-list{display:flex;flex-direction:column}
.bf-st{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 4px;border:0;border-top:1px solid var(--line);background:none;font:inherit;font-size:12px;color:inherit;text-align:left;cursor:pointer}
.bf-st:hover{background:rgba(255,255,255,.06)}
.bf-st i{width:8px;height:8px;border-radius:50%}
.bf-st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bf-st em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.bf-st b{font-size:11.5px;font-weight:500;color:var(--ink-2)}
.bf-go{width:100%;margin-top:10px;font:inherit;font-size:12.5px;color:#1a1206;background:var(--tapi);border:0;border-radius:9px;padding:7px;cursor:pointer;font-weight:500}
.basin.focus{stroke:#fff!important;stroke-width:2.5px!important;fill-opacity:.06!important}
@media (max-width:820px){.bfocus{top:calc(64px + env(safe-area-inset-top,0px));left:12px;right:calc(70px + env(safe-area-inset-right,0px));width:auto;max-height:30vh;padding:10px 12px}.bfocus .bf-l,.bfocus .bf-list,.bfocus .bf-m{display:none}.bf-h b{font-size:15px}.bf-g b{font-size:15px}}

/* ---------- modelled hydrograph in station cards, 2020 check ---------- */
.mhwrap{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.mh-t{font-size:11.5px;color:var(--ink-2)}
.mh-area{fill:rgba(240,162,74,.16)}
.mh-ln{fill:none;stroke:var(--tapi);stroke-width:2;stroke-linejoin:round}
.mh-now{stroke:#5fd0ff;stroke-width:1.4;stroke-dasharray:4 3}
.mh-nowl{font-size:9.5px;fill:#5fd0ff;font-weight:500}
.skill{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.skill b{color:var(--ink);font-weight:600}
.skill small{display:block;color:var(--ink-3);font-size:10.5px}
.ev-sim{fill:none;stroke:var(--tapi);stroke-width:2;stroke-dasharray:5 3}
.ev-pk{fill:var(--tapi);stroke:#fff;stroke-width:1.2}
.dq-lab.ev{fill:var(--tapi);font-weight:500}
.evleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink-2);margin:4px 0 8px}
.evleg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.evleg i.o{border-color:#4fb8ee} .evleg i.s{border-color:var(--tapi);border-top-style:dashed}
.evleg i.m{height:10px;border:0;background:#3182bd;border-radius:2px;width:14px}
.evleg i.g{height:10px;border:2px solid #ff40a0;background:rgba(244,114,182,.3);border-radius:2px;width:14px}
.dinsight{font-size:12.5px;line-height:1.6;color:var(--ink-2);background:rgba(240,162,74,.08);border-left:3px solid var(--tapi);border-radius:0 8px 8px 0;padding:8px 10px;margin:10px 0 0}
.dinsight b{color:var(--ink)}
.seg.dev{margin:0 0 8px}
.dval{margin-top:12px;background:rgba(79,184,238,.07);border:1px solid rgba(79,184,238,.35);border-radius:12px;padding:10px 12px}
.dval>b{font-size:13.5px;font-weight:500}
.dval p{font-size:12px;color:var(--ink-2);line-height:1.55;margin:4px 0 8px}
.dvbtn{font:inherit;font-size:12.5px;color:#06202e;background:#5fc8ff;border:0;border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:500}
.dvbtn[aria-pressed="true"]{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.dvbtn:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.dvstat{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.dvstat b{font-size:30px;font-weight:600;color:#ff6fb5;line-height:1}
.dvstat span{font-size:12px;color:var(--ink-2);line-height:1.45}
.tv2020{margin-top:8px;font:inherit;font-size:12px;color:#5fc8ff;background:none;border:1px solid rgba(95,200,255,.45);border-radius:8px;padding:5px 10px;cursor:pointer}
.tv2020[aria-pressed="true"]{background:rgba(95,200,255,.15)}
#panel>*{flex-shrink:0}

/* stations inside the Tapi study outline (ThaiWater uses ONWR basin codes; Tapi is part of 19) */
function ptInRing(x,y,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function inTapi(r){if(!r.basin||+r.basin.basin_code!==19)return false;const g=D.tapiStudy.geometry,x=+r.station.tele_station_long,y=+r.station.tele_station_lat;
  const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;return polys.some(p=>ptInRing(x,y,p[0]));}

function tapiRainHTML(){if(!RAIN)return '<p class="lede">กำลังโหลดข้อมูลฝน…</p>';const b=RAIN.basins['19'];if(!b)return '';
  const W=360,H=110,pl=30,pr=6,pt=8,pb=20,n=b.hourly.length,vmax=Math.max(1,Math.ceil(Math.max(...b.hourly)));
  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-v/vmax),bw=(W-pl-pr)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="ฝนพยากรณ์เฉลี่ยรายชั่วโมง ลุ่มน้ำ 19">`;
  [0,vmax/2,vmax].forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;});

  RAIN.times.forEach((tm,i)=>{if(tm.endsWith('T00:00')&&i<RAIN.times.length-4)s+=`<text class="ax" x="${x(i)}" y="${H-5}" text-anchor="start">${rainDay(tm)}</text>`;});

/* ---------- live water level & discharge (ThaiWater public API, HII) ---------- */
const TW='https://api-v3.thaiwater.net/api/v1/thaiwater30/public/';
const SIT_TH={1:'น้ำน้อยวิกฤต',2:'น้ำน้อย',3:'ปกติ',4:'น้ำมาก',5:'ล้นตลิ่ง'};
const SIT_ORDER=[5,4,1,2,3];
const liveLayer=L.layerGroup(), liveRenderer=L.svg({padding:.5});
let LIVE=null, liveLoading=null, liveErr=false;
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const nnum=v=>v===null||v===undefined||v===''||isNaN(+v)?null:+v;
const twTime=s=>new Date(String(s).replace(' ','T')+':00+07:00').getTime();
const sitOf=r=>{const s=+r.situation_level;return s>=1&&s<=5?s:0;};
const isOld=r=>!r.waterlevel_datetime||Date.now()-twTime(r.waterlevel_datetime)>24*3600e3;
const fmtTime=t=>new Date(t).toLocaleString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function loadLive(){
  if(LIVE&&Date.now()-LIVE.t<10*60e3)return Promise.resolve(LIVE);
  if(liveLoading)return liveLoading;
  liveLoading=getJSON(TW+'waterlevel_load').then(j=>{
    const rows=(j.waterlevel_data&&j.waterlevel_data.data||[]).filter(r=>r.station&&nnum(r.station.tele_station_lat)&&nnum(r.station.tele_station_long));
    LIVE={t:Date.now(),rows};liveErr=false;drawLive();fillLive();window.__rivReady&&fillRiver();window.__bsReady&&fillBasinSit();return LIVE;
  }).catch(e=>{liveErr=true;fillLive();window.__bsReady&&fillBasinSit();throw e;}).finally(()=>{liveLoading=null;});
  return liveLoading;
}
function drawLive(){
  liveLayer.clearLayers();
  const order=r=>SIT_ORDER.indexOf(sitOf(r));
  [...LIVE.rows].sort((a,b)=>order(b)-order(a)).forEach(r=>{
    const s=sitOf(r),st=r.station,old=isOld(r);
    const m=L.circleMarker([+st.tele_station_lat,+st.tele_station_long],{renderer:liveRenderer,radius:s===5?6.5:s===4?5.5:4.5,weight:1,
      color:cssv('--panel'),fillColor:s?cssv('--s'+s):cssv('--ink-3'),fillOpacity:old?.3:.95});

/* popup with latest values and 7-day charts */
function lineChart(pts,{refs=[],unit='',label=''}){
  const W=340,H=128,pl=42,pr=8,pt=8,pb=20;
  const v=pts.filter(p=>p.v!==null);if(v.length<2)return `<p class="lc-empty">ไม่มีข้อมูล${label} 7 วันที่ผ่านมา</p>`;
  const t0=v[0].t,t1=v[v.length-1].t;
  const show=refs.filter(r=>r.v!==null&&r.v!==undefined&&r.inDomain!==false);
  let lo=Math.min(...v.map(p=>p.v),...show.map(r=>r.v)),hi=Math.max(...v.map(p=>p.v),...show.map(r=>r.v));
  if(hi-lo<0.2){hi+=0.1;lo-=0.1;}const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const x=t=>pl+(W-pl-pr)*(t-t0)/Math.max(1,t1-t0),y=val=>pt+(H-pt-pb)*(1-(val-lo)/(hi-lo));
  const dec=hi-lo<5?2:hi-lo<50?1:0;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart lc" role="img" aria-label="${label}">`;
  [lo+pad,(lo+hi)/2,hi-pad].forEach(val=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(val)}" y2="${y(val)}"/><text class="ax" x="${pl-4}" y="${y(val)+3}" text-anchor="end">${val.toFixed(dec)}</text>`;});
  show.forEach(r=>{s+=`<line class="ref ${r.cls}" x1="${pl}" x2="${W-pr}" y1="${y(r.v)}" y2="${y(r.v)}"/><text class="refl ${r.cls}" x="${W-pr-2}" y="${y(r.v)-3}" text-anchor="end">${r.name}</text>`;});
  let path='',pen=false,prev=null;
  pts.forEach(p=>{if(p.v===null||(prev&&p.t-prev>3*3600e3)){pen=false;}if(p.v!==null){path+=(pen?'L':'M')+x(p.t).toFixed(1)+','+y(p.v).toFixed(1);pen=true;prev=p.t;}});
  s+=`<path class="ln" d="${path}"/>`;
  const last=v[v.length-1];s+=`<circle class="lp" cx="${x(last.t)}" cy="${y(last.v)}" r="3"/>`;
  for(let d=new Date(t0);d.getTime()<=t1;d.setDate(d.getDate()+2)){const dd=new Date(d.toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})+'T00:00:00+07:00').getTime();if(dd<t0)continue;
    s+=`<text class="ax" x="${x(dd)}" y="${H-5}" text-anchor="middle">${new Date(dd).toLocaleDateString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'})}</text>`;}
  return s+`</svg>`;
}

/* ---------- hourly rainfall layer (from .mat via tools/rain_mat_to_dashboard.py) ---------- */
const rainLayer=L.layerGroup();
let RAIN=null,rainImg=null,rainLoading=null;
const rstate={k:0,timer:null};
const rainTime=s=>{const[d,h]=s.split('T');const[y,mo,da]=d.split('-').map(Number);return new Date(Date.UTC(y,mo-1,da)).toLocaleDateString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})+' '+h+' น.';};
function loadRain(){
  if(RAIN)return Promise.resolve(RAIN);
  if(rainLoading)return rainLoading;
  rainLoading=getJSON('data/rain_hourly/rain.json').then(j=>{RAIN=j;
    rainImg=L.imageOverlay('data/rain_hourly/'+j.frames[0],j.bounds,{opacity:.85,className:'rainimg',pane:'rainPane'});rainLayer.addLayer(rainImg);
    j.frames.forEach(f=>{const im=new Image();im.src='data/rain_hourly/'+f;});   // warm the cache for smooth play
    rstate.k=j.domain_max.indexOf(Math.max(...j.domain_max));
    return j;}).finally(()=>{rainLoading=null;});
  return rainLoading;
}
map.createPane('rainPane');map.getPane('rainPane').style.zIndex=380;map.getPane('rainPane').style.pointerEvents='none';
/* Windy-style timeline along the bottom of the map */
const wtl=L.DomUtil.create('div','wtl',map.getContainer());wtl.hidden=true;
L.DomEvent.disableClickPropagation(wtl);L.DomEvent.disableScrollPropagation(wtl);
const rainDay=s=>{const[y,mo,da]=s.split('T')[0].split('-').map(Number);return new Date(Date.UTC(y,mo-1,da)).toLocaleDateString('th-TH-u-ca-gregory',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});};
function buildWtl(){
  if(!RAIN)return;const n=RAIN.times.length,days=[];
  RAIN.times.forEach((t,i)=>{const d=t.split('T')[0];if(!days.length||days[days.length-1].d!==d)days.push({d,i0:i,n:0});days[days.length-1].n++;});
  const lg=RAIN.legend,vm=RAIN.vmax;
  wtl.innerHTML=`<button class="wtl-play" id="wtlPlay" aria-label="เล่น">▶</button>
    <div class="wtl-main"><div class="wtl-track" id="wtlTrack" role="slider" tabindex="0" aria-label="เวลา" aria-valuemin="0" aria-valuemax="${n-1}">
      ${days.map(x=>`<div class="wtl-day" style="flex:${x.n}"><span>${x.n>=4?rainDay(RAIN.times[x.i0]):""}</span></div>`).join('')}
      <div class="wtl-fill" id="wtlFill"></div><div class="wtl-knob" id="wtlKnob"><span id="wtlLabel"></span></div></div></div>
    <div class="wtl-legend"><span class="u">ฝนพยากรณ์ · ${RAIN.unit} · ${/เวลาไทย/.test(RAIN.time_ref||"")?"เวลาไทย":"เวลาตามไฟล์"}</span><div class="bar" style="background:linear-gradient(90deg,${lg.map(s=>s.color).join(',')})">
      ${[.1,vm/4,vm/2,vm*3/4,vm].map(v=>`<i>${v<1?v:Math.round(v)}</i>`).join('')}</div></div>`;
  document.getElementById('wtlPlay').onclick=toggleRainPlay;
  const tr=document.getElementById('wtlTrack');
  const at=ev=>{const r=tr.getBoundingClientRect();return Math.round(Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*(n-1));};
  tr.onpointerdown=ev=>{stopRain();tr.setPointerCapture(ev.pointerId);setRainHour(at(ev));tr.onpointermove=e=>setRainHour(at(e));};
  tr.onpointerup=()=>{tr.onpointermove=null;};
  tr.onkeydown=ev=>{if(ev.key==='ArrowRight'){stopRain();setRainHour(Math.min(n-1,rstate.k+1));}if(ev.key==='ArrowLeft'){stopRain();setRainHour(Math.max(0,rstate.k-1));}};
  renderRainCtl();
}
function renderRainCtl(){if(!RAIN||!document.getElementById('wtlKnob'))return;const n=RAIN.times.length,f=rstate.k/(n-1)*100;
  document.getElementById('wtlFill').style.width=f+'%';document.getElementById('wtlKnob').style.left=f+'%';
  document.getElementById('wtlLabel').textContent=rainDay(RAIN.times[rstate.k])+' '+RAIN.times[rstate.k].split('T')[1];

function setRainHour(k){rstate.k=k;if(rainImg)rainImg.setUrl('data/rain_hourly/'+RAIN.frames[k]);renderRainCtl();updateRainPanel();if(state.view==='tapi'||state.view==='demo'){const el=document.getElementById('tapiRain');if(el){el.querySelectorAll('rect.trb').forEach(r=>r.classList.toggle('on',+r.dataset.h===k));const v=el.querySelectorAll('.kv b')[1];if(v)v.textContent=RAIN.basins['19'].hourly[k].toFixed(2);}}}
function stopRain(){if(rstate.timer){clearInterval(rstate.timer);rstate.timer=null;renderRainCtl();}}
function toggleRainPlay(){if(rstate.timer)stopRain();else{rstate.timer=setInterval(()=>setRainHour((rstate.k+1)%RAIN.frames.length),400);renderRainCtl();}}

function drawRivers(){
  riverLines.clearLayers(); if(!RIV_G)return;
  const sel=[];
  RIV_G.features.forEach(f=>{
    const ll=f.geometry.coordinates.map(c=>[c[1],c[0]]), n=f.properties.name, on=!!n&&n===RSEL.name,
      main=n==='แม่น้ำตาปี'||n==='แม่น้ำพุมดวง';
    const lines=[
      L.polyline(ll,{renderer:riverRenderer,interactive:false,color:on?'#ffb347':'#4fb8ee',opacity:on?.95:.6,weight:on?5:main?3.4:2.2,lineCap:'round',lineJoin:'round'}),

function snapRiver(lat,lon){
  let best=null,bd=1.5; const kx=111.32*Math.cos(lat*Math.PI/180), ky=110.57;
  RIV_G.features.forEach(f=>{const c=f.geometry.coordinates;
    for(let i=0;i<c.length-1;i++){
      const ax=(c[i][0]-lon)*kx,ay=(c[i][1]-lat)*ky,bx=(c[i+1][0]-lon)*kx,by=(c[i+1][1]-lat)*ky,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
      let t=L2?-(ax*dx+ay*dy)/L2:0; t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(ax+t*dx,ay+t*dy);
      if(d<bd){bd=d;best={name:f.properties.name,km:c[i][2]+(c[i+1][2]-c[i][2])*t,d};}}});

function riverGroups(){

  LIVE.rows.filter(r=>r.basin&&+r.basin.basin_code===19).forEach(r=>{

    const sn=r._sn; if(!sn){if(inTapi(r))off.push(r);return;}
    const name=(r.river_name&&String(r.river_name).trim())||sn.name||'ลำน้ำไม่ระบุชื่อ';
    (G[name]=G[name]||{name,rows:[]}).rows.push({r,km:sn.km,on:sn.name});
  });
  const groups=Object.values(G);
  groups.forEach(g=>{g.rows.sort((a,b)=>b.km-a.km);const last=g.rows[g.rows.length-1];
    if(CONF[g.name]){g.to=CONF[g.name];g.toKm=endKm(g.name);}

const dTH=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});};
const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10);};
const niceMax=v=>{const st=v>1000?200:v>400?100:50;return Math.ceil(v/st)*st;};
function hydroCardSVG(st,nowQ,qmax){

  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-v/ymax),ipk=h.q.indexOf(Math.max(...h.q));
  const pts=h.q.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart mh" role="img" aria-label="กราฟน้ำท่าจากแบบจำลองที่ ${st}">`;
  [0,ymax/2,ymax].forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${fmt(v,0)}</text>`;});

  s+=`<path class="mh-area" d="M${x(0)},${y(0)}L${pts.join('L')}L${x(n-1)},${y(0)}Z"/><path class="mh-ln" d="M${pts.join('L')}"/>`;
  if(nowQ!==null&&nowQ!==undefined)s+=`<line class="mh-now" x1="${pl}" x2="${W-pr}" y1="${y(nowQ)}" y2="${y(nowQ)}"/><text class="mh-nowl" x="${pl+4}" y="${y(nowQ)-4}">ตอนนี้ ${fmt(nowQ,nowQ<100?1:0)}</text>`;
  s+=`<circle class="dq-pk" cx="${x(ipk)}" cy="${y(h.q[ipk])}" r="3.5"/><text class="dq-lab pk" x="${Math.min(Math.max(x(ipk),pl+40),W-pr-40)}" y="${y(h.q[ipk])-7}" text-anchor="middle">สูงสุด ${fmt(h.peak,0)} · ${dTH(h.peak_date)}</text>`;
